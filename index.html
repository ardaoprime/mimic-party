<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimic Party</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#1b1340;--ink2:#2c2062;--red:#ff5a4e;--yel:#ffe14d;--mint:#5fe3c0;--paper:#fff7ea}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:"Baloo 2","Trebuchet MS","Segoe UI Rounded",system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 0 40px}
h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:.2em 0 .1em;color:var(--yel);letter-spacing:-.02em}
h2{font-size:1.8rem;margin:.2em 0}
p{line-height:1.45;margin:.5em 0}.muted{opacity:.75}
button{font:inherit;font-weight:700;font-size:1.15rem;border:0;border-radius:14px;padding:.8em 1.2em;background:var(--red);color:#fff;cursor:pointer;width:100%;margin-top:12px}
button.alt{background:var(--ink2);color:var(--paper);border:2px solid var(--mint)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input{font:inherit;font-size:1.1rem;padding:.7em;border-radius:12px;border:2px solid var(--ink2);background:var(--paper);color:var(--ink);width:100%;margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--ink2);border-radius:99px;padding:.35em .9em}
.chip.host{border:2px solid var(--yel)}
.screen{display:none}.screen.on{display:block}
.code{font-size:3rem;font-weight:800;letter-spacing:.15em;color:var(--yel)}
.orb{width:170px;height:170px;border-radius:50%;margin:24px auto;background:var(--mint);display:grid;place-items:center;color:var(--ink);font-size:3rem;font-weight:800;transition:transform .06s}
.bar{height:14px;border-radius:9px;background:var(--ink2);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--yel);width:0}
table{width:100%;border-collapse:collapse;margin:10px 0}td{padding:.5em .3em;border-bottom:1px solid var(--ink2)}td:last-child{text-align:right;font-weight:800}
.wheelbox{position:relative;width:min(70vw,300px);aspect-ratio:1;margin:26px auto 14px}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid var(--paper);transition:transform 4s cubic-bezier(.12,.7,.1,1);
background:conic-gradient(var(--red) 0 60deg,var(--ink2) 60deg 120deg,var(--mint) 120deg 180deg,var(--yel) 180deg 240deg,#9b7bff 240deg 300deg,#ff9b4e 300deg 360deg)}
.wheel span{position:absolute;left:50%;top:50%;width:90px;margin-left:-45px;margin-top:-10px;text-align:center;font-weight:800;font-size:.9rem;color:#fff;text-shadow:0 1px 2px #0006;line-height:1}
.pin{position:absolute;left:50%;top:-14px;margin-left:-14px;border:14px solid transparent;border-top:26px solid var(--paper);z-index:2}
.err{color:var(--yel);min-height:1.4em;font-weight:700}
@media (prefers-reduced-motion:reduce){.wheel{transition-duration:.5s}}
</style>
</head>
<body>
<main>

<section class="screen on" id="s-join">
  <h1>Mimic<br>Party</h1>
  <p class="muted">Un son, tout le monde l'imite avec la voix en même temps, chacun depuis chez soi. Hauteur et rythme sont notés.</p>
  <input id="name" placeholder="Ton prénom" maxlength="14" autocomplete="off">
  <input id="code" placeholder="Code de la salle (pour rejoindre)" maxlength="4" autocomplete="off" style="text-transform:uppercase">
  <button id="create">Créer une salle</button>
  <button id="join" class="alt">Rejoindre avec le code</button>
  <p class="err" id="err"></p>
  <p class="muted" style="font-size:.9rem">Autorise le micro quand le navigateur le demande. Un casque évite que ton micro capte le son du jeu.</p>
</section>

<section class="screen" id="s-lobby">
  <p class="muted">Code de la salle</p>
  <div class="code" id="lcode"></div>
  <button id="copy" class="alt">Copier le lien d'invitation</button>
  <div class="chips" id="chips"></div>
  <div id="hostbox">
    <label class="muted" for="rounds">Manches : <b id="rv">5</b></label>
    <input id="rounds" type="range" min="3" max="10" value="5" style="padding:0">
    <button id="start">Lancer la partie</button>
  </div>
  <p class="muted" id="waitHost"></p>
</section>

<section class="screen" id="s-play" style="text-align:center">
  <p class="muted" id="plabel"></p>
  <h2 id="ptitle"></h2>
  <div class="orb" id="orb"></div>
  <div class="bar"><i id="lvl"></i></div>
  <p id="pstatus" class="muted"></p>
</section>

<section class="screen" id="s-res" style="text-align:center">
  <h2 id="wtitle"></h2>
  <table id="rtab"></table>
  <div class="wheelbox"><div class="pin"></div><div class="wheel" id="wheel"></div></div>
  <p id="wres" style="font-size:1.25rem;font-weight:700;min-height:1.6em"></p>
  <table id="ttab"></table>
  <button id="next" style="display:none"></button>
  <p class="muted" id="wait2"></p>
</section>

<section class="screen" id="s-end">
  <h1>Fin de partie</h1>
  <table id="final"></table>
  <button id="again" style="display:none">Rejouer dans la même salle</button>
  <p class="muted" id="wait3"></p>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)};
let me=null,room=null,S=null,ac=null,stream=null,analyser=null,es=null,lastToken='',resToken='',rot=0;

/* ---------- Réseau (Supabase Realtime, sans serveur à toi) ---------- */
const SB_URL='https://hyhkemsvxulgdymoznwt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5aGtlbXN2eHVsZ2R5bW96bnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDkyMTIsImV4cCI6MjEwNzE4NTIxMn0.pdwyE5EoNuXKFwyR9saBOKxbEZQBFlVnROOBOxbroGI';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let ch=null,amHost=false,R=null;
const rid=()=>Math.random().toString(36).slice(2,10);
const newCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
const send=(event,payload)=>ch.send({type:'broadcast',event,payload});

/* L'hôte fait tourner la logique de la partie dans son navigateur */
function makeRef(){
  const scale=[0,2,4,7,9,12,14,16],base=57+Math.floor(Math.random()*6),n=3+Math.floor(Math.random()*3),notes=[];let prev=-1,t=0;
  for(let i=0;i<n;i++){let k;do{k=Math.floor(Math.random()*scale.length)}while(k===prev);prev=k;
    const d=[0.3,0.45,0.6][Math.floor(Math.random()*3)];notes.push({m:base+scale[k],d,t});t+=d+0.12}
  return{notes,dur:t-0.12};
}
const SEG=[
 {t:'Score ×2',f:(w)=>{w.score+=w.rs;return w.name+' double son score de la manche (+'+w.rs+').'}},
 {t:'Bonus +30',f:(w)=>{w.score+=30;return w.name+' gagne 30 points.'}},
 {t:'Piège −30',f:(w,l)=>{if(l===w)return 'Personne à piéger. Dommage.';l.score=Math.max(0,l.score-30);return l.name+' tombe dans le piège : −30 points.'}},
 {t:'Bonus +10',f:(w)=>{w.score+=10;return w.name+' gagne 10 points.'}},
 {t:'Poisse −30',f:(w)=>{w.score=Math.max(0,w.score-30);return w.name+' perd 30 points. Aïe.'}},
 {t:'Rien',f:()=>'Rien ne se passe. Suspense gâché.'}
];
const pubR=()=>({room:R.code,phase:R.phase,hostId:R.hostId,round:R.round,rounds:R.rounds,token:R.token,ref:R.ref,wheel:R.wheel,
  players:[...R.players.values()].map(p=>({id:p.id,name:p.name,score:p.score,rs:p.rs,done:p.done}))});
function push(){S=pubR();send('state',S);render()}
function startRound(){
  R.round++;R.phase='listen';R.ref=makeRef();R.token=rid();R.wheel=null;
  R.players.forEach(p=>{p.done=false;p.rs=0});
  clearTimeout(R.timer);R.timer=setTimeout(endRound,(R.ref.dur+14)*1000);
}
function endRound(){
  if(R.phase!=='listen')return;clearTimeout(R.timer);
  const ps=[...R.players.values()];ps.forEach(p=>{p.score+=p.rs});
  const s=ps.slice().sort((a,b)=>b.rs-a.rs),w=s[0],l=s[s.length-1],idx=Math.floor(Math.random()*SEG.length);
  R.wheel={idx,msg:SEG[idx].f(w,l),label:SEG[idx].t,winner:w.name};R.phase='results';push();
}
function hostAct(id,b){
  const p=R.players.get(id);if(!p)return;const host=R.hostId===id;
  if(b.type==='rounds'&&host&&R.phase==='lobby')R.rounds=Math.max(1,Math.min(15,+b.v||5));
  else if(b.type==='start'&&host&&R.phase==='lobby'){R.round=0;R.players.forEach(x=>x.score=0);startRound()}
  else if(b.type==='submit'&&R.phase==='listen'&&!p.done){
    p.rs=Math.max(0,Math.min(100,Math.round(+b.score||0)));p.done=true;
    if([...R.players.values()].every(x=>x.done))return endRound();
  }
  else if(b.type==='next'&&host&&R.phase==='results'){if(R.round>=R.rounds)R.phase='end';else startRound()}
  else if(b.type==='again'&&host&&R.phase==='end'){R.phase='lobby';R.round=0;R.players.forEach(x=>x.score=0)}
  push();
}
function hostHello({id,name}){
  if(R.players.has(id))return push();
  const rej=m=>send('reject',{id,error:m});
  if(R.phase!=='lobby')return rej('La partie a déjà commencé.');
  if([...R.players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase()))return rej('Ce prénom est déjà pris.');
  if(R.players.size>=10)return rej('Salle pleine (10 joueurs).');
  R.players.set(id,{id,name,score:0,rs:0,done:false});push();
}
function hostLeave(key){
  if(!R.players.has(key)||key===R.hostId)return;
  R.players.delete(key);
  if(R.phase==='listen'&&[...R.players.values()].every(x=>x.done))return endRound();
  push();
}
const act=(type,extra)=>{if(amHost)hostAct(me,{type,...extra});else send('act',{id:me,type,...extra})};

function fail(msg){
  if(ch){sb.removeChannel(ch);ch=null}S=null;amHost=false;
  $('err').textContent=msg;show('s-join');
}
function connect(code,host,name){
  room=code;amHost=host;
  ch=sb.channel('mimic-'+code,{config:{broadcast:{self:false},presence:{key:me}}});
  ch.on('broadcast',{event:'state'},({payload})=>{S=payload;render()});
  ch.on('broadcast',{event:'reject'},({payload})=>{if(payload.id===me)fail(payload.error)});
  if(host){
    ch.on('broadcast',{event:'act'},({payload})=>hostAct(payload.id,payload));
    ch.on('broadcast',{event:'hello'},({payload})=>hostHello(payload));
  }
  ch.on('presence',{event:'leave'},({key})=>{
    if(host)hostLeave(key);
    else if(S&&key===S.hostId){alert("L'hôte a quitté la partie.");location.href=location.pathname}
  });
  ch.subscribe(status=>{
    if(status==='SUBSCRIBED'){
      ch.track({name});
      if(host){R={code,phase:'lobby',players:new Map(),hostId:me,round:0,rounds:5,token:'',ref:null,wheel:null,timer:null};
        R.players.set(me,{id:me,name,score:0,rs:0,done:false});push()}
      else{send('hello',{id:me,name});setTimeout(()=>{if(!S&&ch)fail("Cette salle n'existe pas, ou son hôte n'est plus là.")},4000)}
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')fail('Connexion au serveur impossible. Réessaie.');
  });
}

const q=new URLSearchParams(location.search);
if(q.get('room'))$('code').value=q.get('room').toUpperCase().slice(0,4);

async function enter(joinRoom){
  $('err').textContent='';
  const name=$('name').value.trim();
  if(!name){$('err').textContent='Entre ton prénom.';return}
  if(joinRoom&&$('code').value.trim().length<4){$('err').textContent='Entre le code de la salle (4 lettres).';return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('err').textContent="Micro indisponible : ouvre le jeu depuis une adresse https://.";return}
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){$('err').textContent="Le micro est bloqué. Autorise-le dans le navigateur puis réessaie.";return}
  analyser=ac.createAnalyser();analyser.fftSize=2048;ac.createMediaStreamSource(stream).connect(analyser);
  me=rid();
  if(joinRoom)connect($('code').value.toUpperCase().trim(),false,name);else connect(newCode(),true,name);
}
$('create').onclick=()=>enter(false);
$('join').onclick=()=>enter(true);
$('copy').onclick=()=>{const l=location.origin+location.pathname+'?room='+room;
  (navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>$('copy').textContent='Lien copié !').catch(()=>prompt('Copie ce lien :',l))};
$('rounds').oninput=e=>{$('rv').textContent=e.target.value;act('rounds',{v:+e.target.value})};
$('start').onclick=()=>act('start');
$('next').onclick=()=>{$('next').style.display='none';act('next')};
$('again').onclick=()=>act('again');

const isHost=()=>S.hostId===me;
function render(){
  if(S.phase==='lobby'){
    $('lcode').textContent=S.room;
    $('chips').innerHTML='';
    S.players.forEach(p=>{const c=document.createElement('span');c.className='chip'+(p.id===S.hostId?' host':'');c.textContent=p.name;$('chips').appendChild(c)});
    $('hostbox').style.display=isHost()?'':'none';
    $('rv').textContent=S.rounds;if(isHost()&&document.activeElement!==$('rounds'))$('rounds').value=S.rounds;
    $('waitHost').textContent=isHost()?'Tu es l\'hôte : lance la partie quand tout le monde est là.':"L'hôte (contour jaune) va lancer la partie.";
    lastToken='';resToken='';
    show('s-lobby');
  }else if(S.phase==='listen'){
    $('plabel').textContent='Manche '+S.round+' sur '+S.rounds;
    if(S.token!==lastToken){lastToken=S.token;show('s-play');playRound(S)}
    const mine=S.players.find(p=>p.id===me);
    if(mine&&mine.done){const n=S.players.filter(p=>p.done).length;$('pstatus').textContent='Ton score est envoyé. '+n+' sur '+S.players.length+' ont terminé.'}
  }else if(S.phase==='results'){
    if(S.token!==resToken){resToken=S.token;showResults()}
  }else if(S.phase==='end'){
    const o=S.players.slice().sort((a,b)=>b.score-a.score);
    fillTable($('final'),o.map((p,i)=>[(i===0?'🏆 ':(i+1)+'. ')+p.name,p.score]),0);
    $('again').style.display=isHost()?'':'none';
    $('wait3').textContent=isHost()?'':"L'hôte peut relancer une partie.";
    show('s-end');
  }
}
function fillTable(t,rows){t.innerHTML='';rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});t.appendChild(tr)})}

/* ---------- Son ---------- */
const FR=50;
function playRef(ref){
  const t0=ac.currentTime+0.05;
  ref.notes.forEach(o=>{
    const osc=ac.createOscillator(),g=ac.createGain();
    osc.type='triangle';osc.frequency.value=440*Math.pow(2,(o.m-69)/12);
    g.gain.setValueAtTime(0,t0+o.t);g.gain.linearRampToValueAtTime(.35,t0+o.t+.03);
    g.gain.setValueAtTime(.35,t0+o.t+o.d-.05);g.gain.linearRampToValueAtTime(0,t0+o.t+o.d);
    osc.connect(g).connect(ac.destination);osc.start(t0+o.t);osc.stop(t0+o.t+o.d+.02);
  });
}
function refFrames(ref){const out=[];for(let t=0;t<ref.dur;t+=FR/1000){const o=ref.notes.find(o=>t>=o.t&&t<o.t+o.d);out.push(o?o.m:null)}return out}
function detect(buf,sr){
  let e=0;for(let i=0;i<buf.length;i++)e+=buf[i]*buf[i];
  const rms=Math.sqrt(e/buf.length);if(rms<0.012)return{f:null,rms};
  const lo=Math.floor(sr/800),hi=Math.floor(sr/80),n=buf.length-hi;let best=0,bl=0;
  for(let l=lo;l<=hi;l++){let c=0;for(let i=0;i<n;i++)c+=buf[i]*buf[i+l];if(c>best){best=c;bl=l}}
  let e0=0;for(let i=0;i<n;i++)e0+=buf[i]*buf[i];
  if(!bl||best/e0<0.55)return{f:null,rms};return{f:sr/bl,rms};
}
const midi=f=>69+12*Math.log2(f/440);
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
function score(refF,pl){
  const rv=refF.filter(x=>x!==null);if(pl.filter(x=>x!==null).length<4)return{total:0,pitch:0,rhythm:0};
  const rm=median(rv);let best=null;
  for(let s=0;s<=14;s++){
    const seg=pl.slice(s,s+refF.length),sv=seg.filter(x=>x!==null);if(sv.length<3)continue;
    const pm=median(sv);let both=0,either=0,err=0;
    for(let j=0;j<refF.length;j++){
      const a=refF[j]!==null,b=seg[j]!==undefined&&seg[j]!==null;if(a||b)either++;
      if(a&&b){both++;let d=(seg[j]-pm)-(refF[j]-rm);d=((d+6)%12+12)%12-6;err+=Math.abs(d)}
    }
    const iou=either?both/either:0,pitch=both?Math.max(0,1-(err/both)/4):0,tot=.45*iou+.55*pitch*Math.sqrt(iou);
    if(!best||tot>best.tot)best={tot,iou,pitch};
  }
  return best?{total:Math.round(best.tot*100),pitch:Math.round(best.pitch*100),rhythm:Math.round(best.iou*100)}:{total:0,pitch:0,rhythm:0};
}

/* ---------- Manche ---------- */
async function playRound(st){
  $('ptitle').textContent='Écoute bien';$('orb').textContent='🔊';$('pstatus').textContent='';
  await ac.resume();playRef(st.ref);
  await sleep(st.ref.dur*1000+800);
  for(let c=3;c>=1;c--){$('ptitle').textContent='Prépare-toi';$('orb').textContent=c;await sleep(600)}
  $('ptitle').textContent='À toi !';$('orb').textContent='🎤';
  const frames=[],buf=new Float32Array(analyser.fftSize),total=Math.round((st.ref.dur+1.6)*1000/FR);
  await new Promise(res=>{const id=setInterval(()=>{
    analyser.getFloatTimeDomainData(buf);const r=detect(buf,ac.sampleRate);
    frames.push(r.f?midi(r.f):null);
    $('lvl').style.width=Math.min(100,r.rms*600)+'%';$('orb').style.transform='scale('+(1+Math.min(.35,r.rms*3))+')';
    if(frames.length>=total){clearInterval(id);res()}},FR)});
  $('orb').style.transform='';$('lvl').style.width='0';
  const sc=score(refFrames(st.ref),frames);
  $('ptitle').textContent='Ton score : '+sc.total;$('orb').textContent=sc.total;
  $('pstatus').textContent='Hauteur '+sc.pitch+' % · Rythme '+sc.rhythm+' %. On attend les autres.';
  act('submit',{score:sc.total});
}

/* ---------- Roue ---------- */
const LABELS=['Score ×2','Bonus +30','Piège −30','Bonus +10','Poisse −30','Rien'];
LABELS.forEach((t,i)=>{const e=document.createElement('span');e.textContent=t;e.style.transform='rotate('+(i*60+30)+'deg) translateY(-95px)';$('wheel').appendChild(e)});
async function showResults(){
  const w=S.wheel,rows=S.players.slice().sort((a,b)=>b.rs-a.rs);
  $('wtitle').textContent=w.winner+' remporte la manche';
  fillTable($('rtab'),rows.map(p=>[p.name,p.rs]));
  $('wres').textContent='';$('ttab').innerHTML='';$('next').style.display='none';$('wait2').textContent='';
  show('s-res');
  const center=w.idx*60+30,target=((-center)%360+360)%360,cur=((rot%360)+360)%360;
  rot+=1800+(((target-cur)%360)+360)%360;
  await sleep(400);$('wheel').style.transform='rotate('+rot+'deg)';
  await sleep(matchMedia('(prefers-reduced-motion:reduce)').matches?700:4300);
  if(S.token!==resToken||S.phase!=='results')return;
  $('wres').textContent=w.label+' : '+w.msg;
  fillTable($('ttab'),S.players.slice().sort((a,b)=>b.score-a.score).map(p=>[p.name,p.score]));
  if(isHost()){$('next').textContent=S.round>=S.rounds?'Voir le résultat final':'Manche suivante';$('next').style.display=''}
  else $('wait2').textContent="On attend l'hôte pour la suite.";
}
</script>
</body>
</html>
